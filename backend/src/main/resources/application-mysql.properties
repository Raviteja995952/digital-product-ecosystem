# ==========================================================================
# PRODUCTION MYSQL CONFIGURATION PROFILE
# Run with: --spring.profiles.active=mysql
# ==========================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ecosystem_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
