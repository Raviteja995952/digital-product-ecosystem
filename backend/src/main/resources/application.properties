# ==========================================================================
# ENTERPRISE DIGITAL PRODUCT ECOSYSTEM - APPLICATION CONFIGURATION
# Dual Profile: Embedded zero-config local mode + MySQL 8.x production mode
# ==========================================================================

server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=digital-product-ecosystem

# Default Local In-Memory Database (MySQL Mode emulation for seamless testing)
spring.datasource.url=jdbc:h2:mem:ecosystem_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Web Console (accessible at /h2-console for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson serialization
spring.jackson.serialization.indent-output=true
